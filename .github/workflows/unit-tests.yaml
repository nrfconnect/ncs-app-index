name: Unit tests

on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'site/src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/unit-tests.yaml'
      - 'site/src/releaseSelectOptions.ts'

  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'site/src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'site/src/releaseSelectOptions.ts'

  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check types
        run: npm run check-types
